[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "consulidate"
version = "0.1.0"
description = "Autonomous corporate council for Telegram forums, powered by AurethosSDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "alembic>=1.13,<2",
  "APScheduler>=3.10,<4",
  "asyncpg>=0.29,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = ["aiosqlite>=0.20,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["consulidate*", "AurethosSDK*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["consulidate"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]
